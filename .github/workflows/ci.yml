name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/ThreatLens.Tests/ThreatLens.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive

  automerge:
    name: Auto-merge Dependabot patch updates
    needs: [build]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Merge when every update in the PR is a patch
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          t="${PR_TITLE#chore: }"
          subject="(chore) ${t,,} (#$PR_NUMBER)"
          # needs: [build] only guarantees this workflow's own job is done. "scan / Scan"
          # comes from the separate security.yml workflow, which the same pull_request
          # event triggers independently and with no ordering guarantee relative to this
          # job, and even once it finishes, GitHub's merge-eligibility state (used by the
          # mergePullRequest GraphQL call inside `gh pr merge`) can lag a check's own
          # completion by a few minutes (eventual consistency). Retry the merge itself
          # with backoff so it waits out both the cross-workflow race and the lag, instead
          # of polling a check that may not exist yet.
          max_attempts=10
          delay=20
          attempt=1
          until gh pr merge "$PR_URL" --squash --subject "$subject" --body ""; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "gh pr merge still failing after $attempt attempts, giving up" >&2
              exit 1
            fi
            echo "merge attempt $attempt failed, required checks may still be running or settling, retrying in ${delay}s" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done
